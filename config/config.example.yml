# Sample configuration for the Canvas → Things Mail Bridge
# Copy to config/config.yml and edit values.

version: 1

canvas:
  base_url: ${CANVAS_BASE_URL}
  courses:
    - id: 12345
      alias: "MATH201"
      include_description: true
    - id: 67890
      alias: "HIST101"
      include_description: false

email:
  from_name: "Canvas Bot"
  subject_template: "{course_alias} – {title}"
  include_description: true
  max_description_chars: 500

run:
  timezone: "America/New_York"
  dry_run: false
  state_file: "data/state.json"

local_sync:
  # Omit project to scan Inbox only. Set it to an exact Things project title
  # to restrict discovery to that project and its headings.
  project:

  # When applying changes, canonical managed tasks can be moved into this
  # project. Leave blank to preserve current project placement.
  move_to_project:

  # Valid values: dry-run, apply
  mode: "dry-run"

  # Hard stop if more than this many managed candidates are discovered.
  candidate_cap: 200

  # Wall-clock timeout for the whole local-sync run.
  timeout_seconds: 120
