[project]
name = "canvas-things-mail-bridge"
version = "0.0.1"
description = "Automation that emails Canvas assignments into Things via Mail to Things"
authors = [{ name = "TODO" }]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.32",
]

[project.optional-dependencies]
deV = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
